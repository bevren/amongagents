<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AmongAgents</title>
<style>
:root {
  --bg: #f4f5f8; --panel: #ffffff; --ink: #161a23; --muted: #646b7a; --line: #e2e5ec;
  --red: #d63b3b; --red-soft: #fde8e8; --green: #1f9d55; --green-soft: #e3f6ea;
  --blue: #2f6fde; --blue-soft: #e6eefc; --amber: #b7791f; --amber-soft: #fdf3e1;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1218; --panel: #171b23; --ink: #e7e9ee; --muted: #8d95a5; --line: #262c38;
    --red: #ff5c5c; --red-soft: #3a1c1f; --green: #3ccf7a; --green-soft: #15301f;
    --blue: #6b9cff; --blue-soft: #18233a; --amber: #f0b44c; --amber-soft: #33281a; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line);
  background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
header .sub { color: var(--muted); }
.badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .5px; }
.b-working { background: var(--green-soft); color: var(--green); }
.b-meeting, .b-voting { background: var(--red-soft); color: var(--red); }
main { display: grid; grid-template-columns: 260px 1fr 340px; gap: 16px; padding: 16px 20px; max-width: 1500px; margin: 0 auto; }
@media (max-width: 1100px) { main { grid-template-columns: 1fr; padding: 16px; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; min-width: 0; }
.card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin: 0 0 10px; }
.stat { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.player { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.crew { width: 26px; height: 30px; border-radius: 13px 13px 6px 6px; position: relative; flex: none; }
.crew::after { content: ""; position: absolute; top: 7px; right: -2px; width: 15px; height: 8px; border-radius: 6px;
  background: #bfe6ff; border: 2px solid rgba(0,0,0,.25); }
.player.off { opacity: .45; }
.speaking { outline: 3px solid var(--red); outline-offset: 2px; }
.order { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 12px; }
.chip { padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; }
.chip.now { background: var(--red); color: #fff; border-color: var(--red); }
.msg { border-left: 3px solid var(--line); padding: 6px 10px; margin: 8px 0; white-space: pre-wrap; word-wrap: break-word; }
.msg .who { font-weight: 600; font-size: 12px; }
.msg.report { border-color: var(--red); background: var(--red-soft); border-radius: 0 8px 8px 0; }
.msg.skip { color: var(--muted); font-style: italic; }
.idea-tag { margin-top: 4px; font-size: 12px; color: var(--amber); font-weight: 600; }
.idea { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line);
  border-radius: 8px; margin: 6px 0; }
.idea.win { border-color: var(--green); background: var(--green-soft); }
.iid { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--amber); flex: none; }
.votes { font-size: 18px; font-variant-numeric: tabular-nums; flex: none; }
.direction { border-color: var(--blue); }
.dir-text { font-size: 15px; font-weight: 600; }
.dir { padding: 8px 0; border-bottom: 1px solid var(--line); }
.dir:last-child { border: 0; padding-bottom: 0; }
.finding { padding: 8px 0; border-bottom: 1px solid var(--line); }
.finding:last-child { border: 0; }
.ok { color: var(--green); font-weight: 600; } .no { color: var(--red); font-weight: 600; }
.log { font-family: ui-monospace, Consolas, monospace; font-size: 12px; max-height: 340px; overflow: auto; }
.log div { padding: 2px 0; border-bottom: 1px dashed var(--line); }
svg text { fill: var(--muted); font-size: 11px; }
a { color: var(--blue); }
table { width: 100%; border-collapse: collapse; }
.grid { display: flex; flex-wrap: wrap; gap: 5px; }
.cell { min-width: 44px; padding: 3px 6px; border-radius: 6px; font-size: 11px; text-align: center; cursor: pointer;
  border: 1px solid var(--line); background: var(--green-soft); color: var(--green); text-decoration: none; }
.cell.meeting, .cell.voting { background: var(--red-soft); color: var(--red); border-color: var(--red); }
.cell.focus { outline: 2px solid var(--ink); outline-offset: 1px; }
.council { padding: 6px 0; border-bottom: 1px solid var(--line); }
.council:last-child { border: 0; }
td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
#alarm { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column;
  background: rgba(150, 0, 0, .82); color: #fff; z-index: 10; text-align: center; padding: 16px; }
#alarm.show { display: flex; animation: flash .5s ease-in-out 4 alternate; }
#alarm .big { font-size: clamp(32px, 7vw, 76px); font-weight: 900; letter-spacing: 2px; }
@keyframes flash { from { background: rgba(150,0,0,.92); } to { background: rgba(220,40,40,.7); } }
</style>
</head>
<body>
<div id="alarm"><div class="big">EMERGENCY MEETING</div><div id="alarm-sub" style="font-size:18px;margin-top:10px"></div></div>
<header>
  <h1>🚨 AmongAgents</h1>
  <span class="sub" id="title"></span>
  <span id="state"></span>
</header>
<div id="app"></div>
<script>
const params = new URLSearchParams(location.search);
const roomId = params.get("room");
let focus = params.get("crew");  // pinned crew or council; null = follow the main storyline
const app = document.getElementById("app");
const COLORS = ["#c51111","#132ed1","#117f2d","#ed54ba","#ef7d0e","#f6f657","#3f474e","#d6e0f0","#6b2fbb","#71491e","#38fedb","#50ef39"];
const color = {}; let snap = null;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = x => x == null ? "—" : (+x).toPrecision(6).replace(/\.?0+$/, "");

async function listRooms() {
  const rooms = await (await fetch("/api/rooms")).json();
  app.innerHTML = `<main style="grid-template-columns:1fr"><div class="card"><h2>Rooms</h2>${rooms.length ? `<table>
    <tr><th>Room</th><th>Task</th><th>State</th><th>Players</th><th>Crews</th><th>Best</th></tr>
    ${rooms.map(r => `<tr><td><a href="?room=${r.room}">${r.room}</a></td><td>${esc(r.task)}</td>
      <td><span class="badge b-${r.state}">${r.state}</span></td><td>${r.players}</td><td>${r.crews ?? 1}</td><td>${fmt(r.best_score)}</td></tr>`).join("")}
    </table>` : `<p class="muted">No rooms yet. Create one with <code>amongagents create-room tasks/tsp</code>.</p>`}</div></main>`;
}

function colorOf(name) {
  if (!(name in color)) color[name] = COLORS[Object.keys(color).length % COLORS.length];
  return color[name];
}

function chart(s) {
  const pts = s.evals.filter(e => e.ok && e.score != null);
  if (!pts.length) return `<p class="muted">No evals yet.</p>`;
  const W = 640, H = 220, P = 56;
  const t0 = pts[0].ts, t1 = Math.max(pts[pts.length - 1].ts, t0 + 1);
  let lo = Math.min(...pts.map(p => p.score)), hi = Math.max(...pts.map(p => p.score));
  if (hi === lo) { hi += 1e-9; lo -= 1e-9; }
  const x = t => P + (t - t0) / (t1 - t0) * (W - P - 8), y = v => 8 + (hi - v) / (hi - lo) * (H - P - 8);
  const minimize = s.task.direction === "minimize";
  let best = null, path = "";
  for (const p of pts) {
    if (best == null || (minimize ? p.score < best : p.score > best)) { best = p.score; }
    path += (path ? "L" : "M") + x(p.ts).toFixed(1) + "," + y(best).toFixed(1);
  }
  const dots = pts.map(p => `<circle cx="${x(p.ts)}" cy="${y(p.score)}" r="4" fill="${colorOf(p.player)}" stroke="var(--panel)" stroke-width="1.5"><title>${esc(p.player)}: ${fmt(p.score)}</title></circle>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="score over time">
    <line x1="${P}" y1="${H - P + 4}" x2="${W}" y2="${H - P + 4}" stroke="var(--line)"/>
    <text x="2" y="14">${fmt(hi)}</text><text x="2" y="${H - P}">${fmt(lo)}</text>
    <text x="${P}" y="${H - 10}">best-ever per run (line) · each eval (dot)</text>
    <path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2" opacity=".55"/>${dots}</svg>`;
}

function transcript(m) {
  const tag = t => t.idea ? `<div class="idea-tag">💡 proposed ${t.idea}</div>` : "";
  return m.transcript.map(t => t.round === 0 && t.kind === "nomination"
    ? `<div class="msg report"><div class="who" style="color:${colorOf(t.player)}">🏛 ${esc(t.player)}: delegate</div>${esc(t.text)}</div>`
    : t.round === 0
    ? `<div class="msg report"><div class="who" style="color:${colorOf(t.player)}">📣 ${esc(t.player)}: report</div>${esc(t.text)}${tag(t)}</div>`
    : t.skipped ? `<div class="msg skip">R${t.round} · ${esc(t.player)} was skipped (timed out)</div>`
    : `<div class="msg" style="border-color:${colorOf(t.player)}"><div class="who">R${t.round} · ${esc(t.player)}</div>${esc(t.text)}${tag(t)}</div>`).join("");
}

function ideas(m, tally, chosen) {
  if (!m.ideas.length) return "";
  return `<h2 style="margin-top:14px">Ideas on the table</h2>` + m.ideas.map(i => `
    <div class="idea ${chosen && chosen.includes(i.id) ? "win" : ""}">
      <span class="iid">${i.id}</span>
      <div style="flex:1;min-width:0"><div>${esc(i.text)}</div><div class="muted">by ${esc(i.by)}</div></div>
      ${tally ? `<b class="votes">${tally[i.id] || 0}</b>` : ""}
    </div>`).join("");
}

function setFocus(id) {
  focus = id;
  const u = new URL(location); id ? u.searchParams.set("crew", id) : u.searchParams.delete("crew");
  window.history.replaceState(null, "", u); refresh();
}

function groupsCard(s) {
  if (!s.groups || s.crews <= 1) return "";
  const councils = s.groups.filter(g => g.level > 0);
  const crews = s.groups.filter(g => g.level === 0);
  const cell = g => `<a class="cell ${g.state} ${g.id === s.focus ? "focus" : ""}" onclick="setFocus('${g.id}')"
      title="${esc(g.id)}: ${g.state}${g.topic ? " · " + esc(g.topic) : ""}${g.level ? "" : ` · best ${fmt(g.best)} (v${g.version})`}">${g.id}${g.level ? "" : `·${g.online}`}</a>`;
  return `<div class="card"><h2>🏛 Councils & crews · ${focus ? `pinned ${esc(focus)} · <a href="#" onclick="setFocus(null);return false">follow live</a>` : "following live"}</h2>
    ${[...new Set(councils.map(g => g.level))].map(lvl => {
      const row = councils.filter(g => g.level === lvl);
      return `<div class="council"><div class="muted">level ${lvl}${row.length === 1 && !row[0].parent ? " · top: decides room-wide" : ""}
          · ${row.reduce((n, g) => n + g.queue, 0)} idea(s) waiting</div>
        <div class="grid" style="margin-top:4px">${row.map(cell).join("")}</div>
        ${row.filter(g => g.state !== "working").map(g => `<div class="muted">🎤 ${esc(g.id)}: ${g.state === "voting" ? "voting" : esc(g.turn || "")} · on ${esc(g.topic || "")}</div>`).join("")}</div>`;
    }).join("")}
    <h2 style="margin-top:12px">${crews.length} crews · ${crews.filter(g => g.state !== "working").length} in a meeting</h2>
    <div class="grid">${crews.map(cell).join("")}</div></div>`;
}

function decisionsCard(s) {
  if (!s.decisions || !s.decisions.length) return "";
  return `<div class="card direction"><h2>🏛 Council decisions</h2>${[...s.decisions].reverse().slice(0, 12).map(d => `<div class="dir">
      <div style="display:flex;gap:8px;align-items:baseline"><span class="iid">${d.idea}</span><span class="dir-text">${esc(d.text)}</span></div>
      <div class="muted">${d.scope === "room" ? "<b>room-wide</b>" : "council " + esc(d.council)} · from ${esc(d.from || "-")} · ${d.votes}/${d.voters} delegate votes · ${Object.keys(d.moved).length} new explorers</div></div>`).join("")}</div>`;
}

function render() {
  const s = snap;
  const multi = s.crews > 1;
  const lineages = multi && s.lineage === "crew";
  const focused = s.groups && s.groups.find(g => g.id === s.focus);
  document.getElementById("title").textContent = `Room ${s.room} · ${s.task.name}` + (multi ? ` · ${s.players_online} online in ${s.crews} crews · showing ${s.focus}` : "");
  document.getElementById("state").innerHTML = `<span class="badge b-${s.state}">${s.state}</span>`;
  const m = s.meeting;
  const shown = !multi ? s.players : s.players.filter(p => focused && focused.level === 0 ? p.crew === s.focus
      : m ? m.participants.includes(p.name) : false);
  const players = shown.map(p => `<div class="player ${p.connected ? "" : "off"}">
      <div class="crew ${m && m.turn === p.name ? "speaking" : ""}" style="background:${colorOf(p.name)}"></div>
      <div><div><b>${esc(p.name)}</b>${p.idea ? ` <span class="iid">${p.idea}</span>` : ""}</div>
      <div class="muted">${p.evals} evals${p.connected ? "" : " · offline"}${multi && m && m.level ? " · from " + esc(p.crew) : ""}</div></div></div>`).join("") || `<p class="muted">${multi ? "No delegates in session." : "Nobody yet."}</p>`;

  let meeting = `<div class="card"><h2>Meeting</h2><p class="muted">No meeting${multi ? " in " + esc(s.focus) : ""}. ${focused && focused.level ? "The council is waiting for ideas…" : "Crew is working…"}</p></div>`;
  if (m) {
    const f = m.finding;
    const deadline = s.state === "voting" ? m.vote_deadline : m.turn_deadline;
    meeting = `<div class="card"><h2>${m.level ? `🏛 Council ${esc(m.group)}` : `🚨 Emergency meeting${multi ? " · crew " + esc(m.group) : ""}`} · ${s.state === "voting" ? "voting" : `round ${m.round}/${m.rounds}`}
        · <span id="countdown" data-deadline="${deadline || ""}"></span></h2>
      ${f.kind === "stagnation" ? `<div class="msg report"><b>🧨 Stagnation meeting</b>: progress stalled, so only brand-new ideas can win.</div>` : ""}
      ${(m.findings || [f]).filter(x => x.kind !== "stagnation" && x.kind !== "council").map(x => `<div><b style="color:${colorOf(x.reporter)}">${esc(x.reporter)}</b> reported a <b>${x.kind}</b>${x.score != null ? ` · score ${fmt(x.score)}` : ""}</div>`).join("")}
      ${s.queue && s.queue.length ? `<div class="muted">${s.queue.length} more ${m.level ? "idea(s) waiting for this council" : "finding(s) queued for the next meeting"}</div>` : ""}
      <div class="order">${m.participants.map(n => `<span class="chip ${m.turn === n ? "now" : ""}">${esc(n)}${m.voted.includes(n) ? " ✓" : ""}</span>`).join("→")}</div>
      ${transcript(m)}${ideas(m)}</div>`;
  } else if (s.last_meeting) {
    const lastMeeting = s.last_meeting, r = lastMeeting.result;
    const council = r.level > 0;
    meeting = `<div class="card"><h2>Last meeting · ${council ? "council " + esc(lastMeeting.group) : `${esc(lastMeeting.finding.reporter)}'s ${lastMeeting.finding.kind}`}</h2>
      <div>${council ? (r.decision ? `Picked <b>${r.decision.idea}</b> → ${Object.keys(r.decision.moved).length} new explorers across ${r.decision.crews} crews${r.decision.scope === "room" ? " (room-wide)" : ""}` : r.split ? "No majority: no decision" : "No idea got a vote")
        : r.changed ? `Crew split up across <b>${r.directions.map(d => d.id).join(", ")}</b>` : "No votes: directions unchanged"}${r.nominated ? ` · sent ${r.nominated.idea} up to ${esc(r.nominated.to)}` : ""}</div>
      ${ideas(lastMeeting, r.tally, r.directions.map(d => d.id))}
      <details style="margin-top:10px"><summary class="muted">Transcript</summary>${transcript(lastMeeting)}</details></div>`;
  }
  const findings = [...s.findings].reverse().map(f => `<div class="finding">
      <div><b style="color:${colorOf(f.reporter)}">${esc(f.reporter)}</b> · ${f.kind}${f.score != null ? ` · <span class="ok">${fmt(f.score)}</span>` : ""}</div>
      <div class="muted">${esc(f.summary.slice(0, 220))}${f.summary.length > 220 ? "…" : ""}</div>
      ${f.chosen_ideas.length ? `<div>→ next: ${f.chosen_ideas.join(", ")}</div>` : ""}</div>`).join("") || `<p class="muted">None yet.</p>`;
  const better = s.task.direction === "minimize" ? Math.min : Math.max;
  const bestOn = id => {  // best run explored under a direction, linked to its experiment commit
    const xs = s.evals.filter(e => e.ok && e.score != null && e.idea === id);
    if (!xs.length) return "—";
    const top = xs.find(e => e.score === better(...xs.map(e => e.score)));
    return top.commit ? `<a href="/api/rooms/${s.room}/diff/${top.commit}" target="_blank" title="${esc(top.description || "")}">${fmt(top.score)}</a> by ${esc(top.player)}` : fmt(top.score);
  };
  const directionCard = focused && focused.level ? "" : `<div class="card direction"><h2>🧭 Directions explored in parallel${multi ? " · crew " + esc(s.focus) : ""}</h2>${s.directions.length
    ? s.directions.map(d => `<div class="dir">
        <div style="display:flex;gap:8px;align-items:baseline"><span class="iid">${d.id}</span><span class="dir-text">${esc(d.text)}</span></div>
        <div class="muted">proposed by ${esc(d.by)} · ${d.adopted ? "picked by council " + esc(d.adopted) : `${d.votes} vote${d.votes === 1 ? "" : "s"}`} · best here: ${bestOn(d.id)}</div>
        <div class="order">${d.agents.map(a => `<span class="chip" style="border-color:${colorOf(a)}">${esc(a)}</span>`).join("")}</div>
      </div>`).join("")
    : `<div class="muted">None yet. Everyone explores freely until the first meeting's vote splits up the crew.</div>`}</div>`;
  const notes = s.notes.map(n => `<li><b>${esc(n.by)}</b>: ${esc(n.text.slice(0, 200))}</li>`).join("");

  app.innerHTML = `<main>
    <div>
      <div class="card"><h2>${lineages ? "Room record" : "Shared best"} · ${esc(s.task.metric)} (${s.task.direction})</h2>
        <div class="stat">${fmt(s.best_score)}</div><div class="muted">${s.best_by ? "by " + esc(s.best_by) + " · " : ""}${lineages && s.room_best.crew ? "crew " + esc(s.room_best.crew) + " · " : ""}baseline v${s.baseline_version}</div>
        ${lineages && focused && !focused.level ? `<div class="muted">crew ${esc(focused.id)} builds on its own line: best <b>${fmt(focused.best)}</b> (v${focused.version}${focused.best_by ? " by " + esc(focused.best_by) : ""})</div>` : ""}
        <div class="muted">improvements must beat the best by ${s.margin ? fmt(s.margin) : 0}${s.noise && s.noise.sd != null ? ` · run-to-run noise ${fmt(s.noise.sd)} over ${s.noise.repeats} repeats` : ""}</div>
        ${s.forks && s.forks.length ? `<div class="muted">🍴 last fork: ${esc(s.forks[s.forks.length - 1].crew)} took ${esc(s.forks[s.forks.length - 1].from)}'s code (${fmt(s.forks[s.forks.length - 1].replaced.score)} → ${fmt(s.forks[s.forks.length - 1].score)}) · ${s.forks.length} recent</div>` : ""}
        ${s.stagnation ? `<div class="muted">${s.stagnation.evals} run${s.stagnation.evals === 1 ? "" : "s"} since the last new best${s.stagnation.limit_evals ? ` · stagnation meeting at ${s.stagnation.limit_evals}` : ""}</div>` : ""}</div>
      <div class="card"><h2>${multi ? (focused && focused.level ? "Delegates" : "Crew " + esc(s.focus)) : "Crew"} (${shown.filter(p => p.connected).length} online)</h2>${players}</div>
      ${groupsCard(s)}
    </div>
    <div>${decisionsCard(s)}${directionCard}${meeting}<div class="card"><h2>Experiments</h2>${chart(s)}</div></div>
    <div>
      ${historyCard()}
      <div class="card"><h2>Findings</h2>${findings}</div>
      ${notes ? `<div class="card"><h2>Shared notes</h2><ul style="padding-left:18px;margin:0">${notes}</ul></div>` : ""}
      <div class="card"><h2>Live log</h2><div class="log" id="log"></div></div>
    </div></main>`;
  renderLog();
}

const logLines = [];
function renderLog() {
  const el = document.getElementById("log");
  if (el) el.innerHTML = logLines.slice(-150).reverse().map(l => `<div>${l}</div>`).join("");
}
function logEvent(e) {
  const t = new Date(e.ts * 1000).toLocaleTimeString();
  const d = {
    eval: () => `${esc(e.player)} eval → ${e.ok ? fmt(e.score) : "failed"}${e.beats_best ? " 🔎" : ""}`,
    meeting_started: () => e.meeting.level ? `🏛 council ${esc(e.meeting.group)} convened` : `🚨 ${esc(e.meeting.finding.reporter)} called a meeting${snap && snap.crews > 1 ? " in " + esc(e.meeting.group) : ""}`,
    decision: () => `🏛 ${esc(e.decision.council)} picked ${e.decision.idea}${e.decision.scope === "room" ? " (room-wide)" : ""}`,
    turn: () => `🎤 R${e.round}: ${esc(e.player)}'s turn`,
    turn_skipped: () => `⏭ ${esc(e.player)} skipped`,
    voting_started: () => `🗳 voting opened`,
    voted: () => `🗳 ${esc(e.player)} voted`,
    said: () => `💬 ${esc(e.player)} spoke${e.idea ? ` and proposed ${e.idea.id}` : ""}`,
    meeting_ended: () => `✅ ${esc(e.meeting.group)} meeting over: ${e.meeting.result.changed ? (e.meeting.level ? "picked " : "exploring ") + e.meeting.result.directions.map(d => d.id).join(", ") : "no votes"}`,
    assignments_changed: () => `🧭 ${Object.entries(e.assignments).map(([a, i]) => esc(a) + "→" + i).join(" ")}`,
    finding_queued: () => `⏳ ${esc(e.finding.reporter)}'s ${e.finding.kind} queued for the next meeting`,
    baseline_updated: () => `⬆ baseline v${e.baseline.version}: ${fmt(e.baseline.score)}`,
    crew_forked: () => `🍴 ${esc(e.fork.crew)} forked onto ${esc(e.fork.from)}'s code: ${fmt(e.fork.replaced.score)} → ${fmt(e.fork.score)}`,
    room_record: () => `🏆 room record ${fmt(e.score)} by ${esc(e.by)} (crew ${esc(e.crew)})`,
    player_joined: () => `+ ${esc(e.player)}`, player_left: () => `− ${esc(e.player)}`,
  }[e.type];
  if (d) { logLines.push(`<span class="muted">${t}</span> ${d()}`); }
}

let refreshTimer = null;
let history = [];
async function refresh() {
  snap = await (await fetch(`/api/rooms/${roomId}` + (focus ? `?crew=${encodeURIComponent(focus)}` : ""))).json();
  if (snap.history) {
    try { history = await (await fetch(`/api/rooms/${roomId}/history`)).json(); } catch (e) {}
  }
  render();
}
function historyCard() {
  if (!snap.history) return "";
  const rows = history.map(c => `<div class="finding">
      <div><span class="iid">${c.version != null ? "v" + c.version : ""}</span> ${esc(c.title.replace(/^v\d+: /, ""))}
        <span class="muted">${c.short}</span>
        ${c.version ? ` · <a href="/api/rooms/${roomId}/diff/${c.version}" target="_blank">diff</a>` : ""}</div>
      ${c.body ? `<div class="muted">${esc(c.body.slice(0, 160))}</div>` : ""}</div>`).join("");
  return `<div class="card"><h2>Git history · <a href="/api/rooms/${roomId}/results.tsv" target="_blank">results.tsv</a></h2>${rows || '<p class="muted">Loading…</p>'}</div>`;
}
// throttled, not debounced: a big room never goes quiet long enough for a debounce to fire
function scheduleRefresh() {
  if (!refreshTimer) refreshTimer = setTimeout(() => { refreshTimer = null; refresh(); }, snap && snap.crews > 1 ? 1000 : 150);
}

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws/rooms/${roomId}/watch`);
  ws.onmessage = ev => {
    const e = JSON.parse(ev.data);
    if (e.type === "fatal") { app.innerHTML = `<main><div class="card">${esc(e.error)}</div></main>`; return; }
    if (e.type === "snapshot") { snap = e.snapshot; snap.players.forEach(p => colorOf(p.name)); render(); refresh(); return; }
    logEvent(e);
    if (e.type === "meeting_started" && (!snap || snap.crews <= 1 || e.meeting.group === focus)) {
      document.querySelector("#alarm .big").textContent = e.meeting.level ? "COUNCIL MEETING" : "EMERGENCY MEETING";
      document.getElementById("alarm-sub").textContent = e.meeting.level ? `council ${e.meeting.group} convenes`
        : `${e.meeting.finding.reporter} found ${e.meeting.finding.kind === "improvement" ? "an improvement" : e.meeting.finding.kind === "stagnation" ? "the crew stalled" : "a clue"}`;
      const a = document.getElementById("alarm"); a.classList.add("show");
      setTimeout(() => a.classList.remove("show"), 2600);
    }
    scheduleRefresh();
  };
  ws.onclose = () => setTimeout(connect, 2000);
}

setInterval(() => {
  const el = document.getElementById("countdown");
  if (el && el.dataset.deadline) el.textContent = Math.max(0, Math.round(el.dataset.deadline - Date.now() / 1000)) + "s left";
}, 500);

if (roomId) connect(); else listRooms();
</script>
</body>
