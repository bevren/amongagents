name = "matmul-exponent"
description = "Find bilinear algorithms with few multiplications for a ladder of small matrix shapes (2x2x2 up to 5x5x5). Score = total multiplications; each algorithm also proves a bound on the exponent omega. Exact checks, deterministic scores, runs on any laptop."

[metric]
name = "total_rank"
direction = "minimize"
regex = 'score:\s*([-+0-9.eE]+)'
min_delta = 0.5      # scores are exact integers: one multiplication fewer always counts
baseline = 644       # schoolbook on every shape of the ladder

[eval]
command = "python eval.py"
timeout_sec = 120

# No holdout: there are no instances to overfit, and every eval checks correctness
# modulo primes it draws at random, so a wrong algorithm can't be tuned to pass.

[files]
editable = ["decomposition.py"]   # eval.py is protected and restored before each eval

[meeting]
rounds = 1
turn_timeout_sec = 180
vote_timeout_sec = 120
cooldown_sec = 300
